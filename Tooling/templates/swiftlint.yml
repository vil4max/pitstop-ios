disabled_rules:
  - trailing_whitespace
opt_in_rules:
  - empty_count
  - force_unwrapping
# SwiftLint resolves `excluded` against this file's directory. Installed as
# Tooling/.swiftlint.yml, the entries need `../` to reach the repository root;
# the unprefixed ones cover a config placed at the root. `.claude` holds agent
# worktrees, which would otherwise be linted as part of the primary checkout.
excluded:
  - Pods
  - .build
  - DerivedData
  - .claude
  - ../Pods
  - ../.build
  - ../DerivedData
  - ../.claude
line_length: 120
identifier_name:
  min_length: 2
# Agree with SwiftFormat, which runs first in `just verify`: it adds trailing
# commas to multiline collections and puts the brace of a multiline header on
# its own line. Without these options every run warns about formatter output.
trailing_comma:
  mandatory_comma: true
opening_brace:
  ignore_multiline_type_headers: true
  ignore_multiline_statement_conditions: true
  ignore_multiline_function_signatures: true
# One threshold set for every app (owner decision, 2026-09-21). Errors fail
# `just verify`, so they sit above the code the apps had when this was set,
# except one 8-member test tuple that belongs in a struct; warnings sit where
# the apps had tightened them. A `switch` over enum cases is not
# branching logic worth splitting, hence ignores_case_statements.
cyclomatic_complexity:
  ignores_case_statements: true
function_body_length:
  warning: 80
  error: 120
type_body_length:
  warning: 300
  error: 500
large_tuple:
  warning: 3
  error: 5
